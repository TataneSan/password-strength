[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "password-strength"
version = "1.0.0"
description = "Score password strength from stdin or arguments, CI-friendly."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
password-strength = "password_strength.cli:main"

[tool.setuptools]
packages = ["password_strength"]
